name: Deploy Client

on:
  push:
    branches: [main]

concurrency:
  group: deploy-client
  cancel-in-progress: false

env:
  NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ env.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ env.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}

      - name: Prepare standalone output
        run: |
          cp -r .next/static .next/standalone/.next/
          # Copy public folder if it exists
          if [ -d "public" ]; then
            cp -r public .next/standalone/
          fi

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Sync standalone output via rsync
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          rsync -avz --delete --mkpath \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            .next/standalone/ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/var/www/salonbook/client/.next/standalone/

      - name: Reload PM2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /var/www/salonbook && pm2 startOrReload ecosystem.config.js --only salonbook-client --update-env && pm2 save

      - name: Local health check
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            for i in {1..10}; do
              if curl -sf http://127.0.0.1:3002 >/dev/null; then
                echo "Client health check passed"
                exit 0
              fi
              echo "Attempt $i/10 failed, retrying in 3s..."
              sleep 3
            done
            echo "Client health check failed after 10 attempts"
            exit 1

      - name: Public health check (non-blocking)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: false
          script: |
            sleep 5
            if curl -sf https://assignmentnine.oxytumzone.com >/dev/null; then
              echo "Public health check passed"
            else
              echo "Public health check failed (non-blocking)"
            fi